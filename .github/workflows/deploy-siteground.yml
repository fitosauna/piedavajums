# Deploys the Latvian landing page (piedavajums.fitosauna.com) to SiteGround.
# Runs automatically on every push/merge to main, and can also be started by hand
# (GitHub -> Actions -> "Deploy to SiteGround" -> Run workflow), optionally as a dry run.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions -> New repository secret):
#   SG_HOST      SSH hostname from SiteGround Site Tools -> Devs -> SSH Keys Manager (e.g. ssh.fitosauna.com or the server IP)
#   SG_PORT      SSH port, SiteGround uses 18765
#   SG_USER      SSH username shown in the same place
#   SG_SSH_KEY   private key from SSH Keys Manager (generated there, or your own key imported there)
#   SG_SSH_PASSPHRASE  the key's password (needed for keys generated in SiteGround; leave out for keys without one)
#   SG_PATH      folder of the site, e.g. www/piedavajums.fitosauna.com/public_html (relative to the SSH home folder)
#
# Only page files are copied. Nothing on the server is deleted (no --delete), so .htaccess and other
# server-only files stay untouched. The CSV lead backup lives one folder above public_html and is never touched.

name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be uploaded, upload nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Check that all secrets are set
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          missing=""
          for v in SG_HOST SG_PORT SG_USER SG_SSH_KEY SG_PATH; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Set up SSH key
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > ~/.ssh/siteground && chmod 600 ~/.ssh/siteground
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Load the key into ssh-agent; a key password (SiteGround-generated keys have one) is supplied non-interactively.
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            printf '#!/bin/sh\nprintf "%%s\\n" "$SG_SSH_PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
            # A wrong password makes ssh-add ask again and again, so stop it after 20 seconds with a clear message.
            if ! DISPLAY=none SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force timeout 20 ssh-add ~/.ssh/siteground < /dev/null; then
              rm -f ~/.ssh/askpass
              echo "::error::Could not unlock the SSH key. Check that SG_SSH_PASSPHRASE is the key's password and SG_SSH_KEY is the full private key."
              exit 1
            fi
            rm -f ~/.ssh/askpass
          else
            ssh-add ~/.ssh/siteground < /dev/null
          fi

      - name: Upload files with rsync
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flags="-rlvz --checksum"
          [ "$DRY_RUN" = "true" ] && flags="$flags --dry-run"
          rsync $flags \
            --exclude '.git/' --exclude '.github/' --exclude '*.md' --exclude '.gitignore' \
            -e "ssh -p $SG_PORT" \
            ./ "$SG_USER@$SG_HOST:$SG_PATH/"

      - name: Reminder
        run: echo "Done. If the page looks unchanged, purge the SiteGround cache (Site Tools -> Speed -> Caching) and the Cloudflare cache."
