# Deploys the Latvian landing page (piedavajums.fitosauna.com) to SiteGround.
# Runs automatically on every push/merge to main, and can also be started by hand
# (GitHub -> Actions -> "Deploy to SiteGround" -> Run workflow), optionally as a dry run.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions -> New repository secret):
#   SG_HOST      SSH hostname from SiteGround Site Tools -> Devs -> SSH Keys Manager (e.g. ssh.fitosauna.com or the server IP)
#   SG_PORT      SSH port, SiteGround uses 18765
#   SG_USER      SSH username shown in the same place
#   SG_SSH_KEY   private key from SSH Keys Manager (generated there, or your own key imported there)
#   SG_SSH_PASSPHRASE  the key's password (needed for keys generated in SiteGround; leave out for keys without one)
#   SG_PATH      folder of the site, e.g. www/piedavajums.fitosauna.com/public_html (relative to the SSH home folder)
#   TRELLO_BOARD_EMAIL  (optional) the Trello board's email-to-board address; every lead is also sent there as a card
#
# Only page files are copied. Nothing on the server is deleted (no --delete). The CSV lead backup lives
# one folder above public_html and is never touched. The server's .htaccess is never replaced: the deploy
# only appends one marked block (once) that stops SiteGround's Dynamic Cache from serving old copies of
# the HTML page after a deploy (SiteGround respects "Cache-Control: no-cache"; images/CSS stay cached).

name: Deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only list what would be uploaded, upload nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Check that all secrets are set
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          missing=""
          for v in SG_HOST SG_PORT SG_USER SG_SSH_KEY SG_PATH; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Set up SSH key
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_SSH_PASSPHRASE: ${{ secrets.SG_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" | tr -d '\r' > ~/.ssh/siteground && chmod 600 ~/.ssh/siteground
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Load the key into ssh-agent; a key password (SiteGround-generated keys have one) is supplied non-interactively.
          eval "$(ssh-agent -s)" > /dev/null
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          if [ -n "$SG_SSH_PASSPHRASE" ]; then
            printf '#!/bin/sh\nprintf "%%s\\n" "$SG_SSH_PASSPHRASE"\n' > ~/.ssh/askpass && chmod 700 ~/.ssh/askpass
            # A wrong password makes ssh-add ask again and again, so stop it after 20 seconds with a clear message.
            if ! DISPLAY=none SSH_ASKPASS=~/.ssh/askpass SSH_ASKPASS_REQUIRE=force timeout 20 ssh-add ~/.ssh/siteground < /dev/null; then
              rm -f ~/.ssh/askpass
              echo "::error::Could not unlock the SSH key. Check that SG_SSH_PASSPHRASE is the key's password and SG_SSH_KEY is the full private key."
              exit 1
            fi
            rm -f ~/.ssh/askpass
          else
            ssh-add ~/.ssh/siteground < /dev/null
          fi

      - name: Upload files with rsync
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flags="-rlvz --checksum"
          [ "$DRY_RUN" = "true" ] && flags="$flags --dry-run"
          rsync $flags \
            --exclude '.git/' --exclude '.github/' --exclude '*.md' --exclude '.gitignore' \
            -e "ssh -p $SG_PORT" \
            ./ "$SG_USER@$SG_HOST:$SG_PATH/"

      # The Trello board's email-to-board address is secret (anyone who knows it can add cards), so it is not
      # in this public repo. It is kept in the repository secret TRELLO_BOARD_EMAIL and written here into
      # lv-trello-email.txt one folder above public_html (next to the CSV backup, not reachable from the web).
      # send-lead.php sends every lead there as a card. Without the secret, leads simply don't go to Trello.
      - name: Write the Trello board address for send-lead.php
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
          TRELLO_BOARD_EMAIL: ${{ secrets.TRELLO_BOARD_EMAIL }}
        run: |
          if [ -z "$TRELLO_BOARD_EMAIL" ]; then
            echo "::warning::Secret TRELLO_BOARD_EMAIL is not set, so leads are not sent to Trello. Add it under Settings -> Secrets and variables -> Actions, then run this workflow again."
            exit 0
          fi
          printf '%s\n' "$TRELLO_BOARD_EMAIL" | ssh -p "$SG_PORT" "$SG_USER@$SG_HOST" "cd '$SG_PATH/..' && umask 077 && cat > lv-trello-email.txt"
          echo "Trello board address written."

      - name: Stop SiteGround caching old copies of the page
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          ssh -p "$SG_PORT" "$SG_USER@$SG_HOST" "cd '$SG_PATH' && bash -s" <<'REMOTE'
          set -e
          touch .htaccess
          if grep -q 'BEGIN fitosauna-no-html-cache' .htaccess; then
            echo "Cache rule already in .htaccess"
          else
            cp .htaccess ".htaccess.bak-$(date +%Y%m%d%H%M%S)"
            cat >> .htaccess <<'RULE'

          # BEGIN fitosauna-no-html-cache (added by the GitHub deploy, keep the markers)
          # SiteGround's Dynamic Cache otherwise keeps serving the old page after a deploy.
          <IfModule mod_headers.c>
            <FilesMatch "\.(html?|php)$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>
          # END fitosauna-no-html-cache
          RULE
            echo "Cache rule added to .htaccess (old file backed up as .htaccess.bak-...)"
          fi
          REMOTE

      - name: Check what visitors get
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          sleep 3
          url="https://piedavajums.fitosauna.com/?utm_source=deploy_check"
          headers=$(curl -s -D - -o page.html "$url" | tr -d '\r')
          echo "$headers" | grep -iE '^(x-proxy-cache|cache-control|last-modified):' || true
          if grep -q "GTM-P8QW4LPF" page.html; then echo "OK: live page has the current version (tracking snippet found)."
          else echo "::warning::Visitors still get an old copy. Flush the cache once: SiteGround Site Tools -> Speed -> Caching -> Dynamic Cache -> Flush."; fi
